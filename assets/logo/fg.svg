<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="amb1" cx="0.22" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#8A6A2E" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8A6A2E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb2" cx="0.9" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#2C4F63" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2C4F63" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2DDB0" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#A9C4D4" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBEBC6"/>
      <stop offset="0.55" stop-color="#E3C68C"/>
      <stop offset="1" stop-color="#B8904A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>
<g transform="translate(512 512) scale(0.74) translate(-512 -512)">

  <!-- ambient ground -->

  <!-- tile shadow -->
  <rect x="222" y="246" width="580" height="580" rx="104" fill="#000000" opacity="0.55" filter="url(#soft)"/>

  <!-- glass element tile -->
  <rect x="212" y="212" width="600" height="600" rx="108" fill="#0B0E14" fill-opacity="0.55"/>
  <rect x="212" y="212" width="600" height="600" rx="108" fill="url(#glass)"/>
  <path d="M320 214 H704 A106 106 0 0 1 810 320 V340 H214 V320 A106 106 0 0 1 320 214 Z" fill="url(#sheen)" opacity="0.6"/>
  <rect x="214" y="214" width="596" height="596" rx="106" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <!-- atomic number -->
  <text x="282" y="322" font-family="Inter" font-weight="600" font-size="58" fill="#E3C68C" fill-opacity="0.9" letter-spacing="1">79</text>

  <!-- rising trend glyph (top-right) -->
  <polyline points="652,318 690,288 712,302 748,262" fill="none" stroke="#7FD6C6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="748" cy="262" r="10" fill="#7FD6C6"/>

  <!-- symbol -->
  <text x="512" y="598" text-anchor="middle" font-family="Instrument Serif" font-size="330" fill="url(#goldText)" letter-spacing="-6">In</text>

  <!-- name -->
  <text x="512" y="690" text-anchor="middle" font-family="Inter" font-weight="500" font-size="50" fill="#ECEEF2" fill-opacity="0.92" letter-spacing="6">Insight</text>

  <!-- three metals -->
  <circle cx="470" cy="748" r="11" fill="#E3C68C"/>
  <circle cx="512" cy="748" r="11" fill="#C8CDD6"/>
  <circle cx="554" cy="748" r="11" fill="#A9C4D4"/>
</g>
</svg>
